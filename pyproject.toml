# ============================================================================
# pyproject.toml —— 工具配置（注意：这不是打包清单）
# ============================================================================
#
# 【为什么这里没有 [project] 和 dependencies？】
#
#   因为依赖的**单一事实来源**是 requirements.txt ——
#   Dockerfile 与 GitHub Actions 都执行 `pip install -r requirements.txt`。
#   如果这里再写一份 [project.dependencies]，就出现了两个真相来源，
#   迟早会出现「本地装的和 CI 装的不一样」这种最难查的问题。
#
#   另一个原因：本项目的定位是**应用**（一个能跑起来的产品），
#   不是「可以被 pip install 的库」—— 它没有对外暴露的 API，
#   别人要的是「跑起来」，不是 `import game_data_analyst`。
#   所以 [project] 元数据（name/version/readme/license）在这里没有意义。
#
# 【为什么没有 [tool.ruff]？】
#
#   因为「配了但没人跑」比「不配」更糟 —— 它会让读者以为代码风格是被强制校验的，
#   实际没有。要加 ruff 得先做一次全量 lint 清理（本项目约 1.9 万行），
#   那是一件独立的事，不适合塞进「加 CI」这个改动里。
#   将来要加时：把 ruff 写进 requirements.txt 的开发依赖、
#   在 CI 里加一步 `ruff check`，然后再补这里的配置。
# ============================================================================

[tool.pytest.ini_options]
# 测试目录固定在 tests/。好处是在项目根目录直接敲 `pytest` 就能跑，
# 不必写全路径 —— CI 里的命令也就能保持一行，不必和目录结构耦合。
testpaths = ["tests"]

# 默认静默模式：只输出「通过/失败」与失败详情。
# 原来文档里写的命令是 `python -m pytest -q`，现在 -q 写进配置，
# 敲 `pytest` 与敲 `python -m pytest` 行为一致，少一处要记的东西。
addopts = "-q"
